name: Deploy to Railway

# Backup auto-deploy path. The preferred path is installing Railway's GitHub App
# on the imbavann-knn account so Railway's native push trigger works. This
# workflow is a fallback that triggers a Railway redeploy on every push to main.
#
# Setup (one-time):
#   1. In repo Settings → Secrets and variables → Actions, add a new secret
#      named RAILWAY_TOKEN with the workspace API token.
#   2. RAILWAY_SERVICE_ID is already correct for the elitez-fmcg `web` service.
#   3. RAILWAY_ENVIRONMENT_ID is already correct for `production`.
#
# Once those secrets are set, every push to main will trigger a Railway redeploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: cb78d82d-4b41-43db-8445-ae91d6280c2a
          RAILWAY_ENVIRONMENT_ID: b04cf340-d6b6-44ea-8a95-dc6421fb9a54
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "RAILWAY_TOKEN secret is not set. Skipping deploy."
            echo "Add a repo secret named RAILWAY_TOKEN to enable auto-deploy."
            exit 1
          fi
          curl -sS --fail -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation(\$id:String!,\$env:String!){ serviceInstanceRedeploy(serviceId:\$id, environmentId:\$env) }\",\"variables\":{\"id\":\"${RAILWAY_SERVICE_ID}\",\"env\":\"${RAILWAY_ENVIRONMENT_ID}\"}}" \
            | tee /tmp/redeploy.json
          grep -q '"serviceInstanceRedeploy":true' /tmp/redeploy.json
          echo "Redeploy triggered."
